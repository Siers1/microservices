server:
  port: 8080

spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: http://localhost:8081
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1

jwt:
  secret: "siersi"